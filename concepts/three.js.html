<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_7 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_7" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_7');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb6cdd4);
scene.fog = new THREE.FogExp2(0xb6cdd4, 0.012);

const camera = new THREE.PerspectiveCamera(40, width / height, 1, 1200);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambLight = new THREE.AmbientLight(0xfff1dc, 0.95);
scene.add(ambLight);
const sunLight = new THREE.DirectionalLight(0xfffae8, 1.25);
sunLight.position.set(60, 100, 45);
scene.add(sunLight);
const skyFill = new THREE.DirectionalLight(0x7397b8, 0.55);
skyFill.position.set(-60, 40, -50);
scene.add(skyFill);

// Dense palette (Art of Rally + Voxel Highlands)
const colorWater = new THREE.Color(0x3a6979);
const colorSand = new THREE.Color(0xd2be91);
const colorLowGrass = new THREE.Color(0x729158);
const colorMidForest = new THREE.Color(0x4a7342);
const colorHighRock = new THREE.Color(0x8a7061);
const colorPeakCrag = new THREE.Color(0xb49a88);
const colorSnow = new THREE.Color(0xeef2f3);

// Large Grid Battlefield + Dense Horizons
const GRID_SIZE = 48;
const TILE_W = 1.4;
const GAP = 0.05;

const boxGeo = new THREE.BoxGeometry(TILE_W - GAP, 1, TILE_W - GAP);
const totalTiles = GRID_SIZE * GRID_SIZE;
const terrainMesh = new THREE.InstancedMesh(boxGeo, new THREE.MeshLambertMaterial({ flatShading: true }), totalTiles);
scene.add(terrainMesh);

const dummy = new THREE.Object3D();
const tileData = [];

function calcBattlefield(ix, iz) {
  const nx = (ix - GRID_SIZE / 2);
  const nz = (iz - GRID_SIZE / 2);

  const riverCurve = Math.sin(nz * 0.18) * 4.5;
  const distToRiver = Math.abs(nx - riverCurve);
  const isRiver = distToRiver < 2.2;

  const ridgeDist = Math.hypot(nx - 14, nz + 4);
  const isAlpinePeak = ridgeDist < 12;

  const isWestBastion = (nx < -6 && nz > -8 && nz < 10);

  let targetH = 0.5;
  let stage = 0;

  if (isRiver) {
    targetH = 0.18;
    stage = 1;
  } else if (isAlpinePeak) {
    const peakFalloff = Math.max(0, 1 - ridgeDist / 12);
    const ruggedNoise = (Math.sin(nx * 0.9) * Math.cos(nz * 0.9) + 1) * 1.6;
    targetH = 2.0 + peakFalloff * 6.5 + ruggedNoise;
    stage = 3;
  } else if (isWestBastion) {
    const stepLevel = Math.floor((12 - Math.abs(nz)) * 0.35);
    targetH = 2.2 + stepLevel * 0.9;
    stage = 2;
  } else {
    const rolling = Math.floor(Math.sin(nx * 0.35) * Math.cos(nz * 0.35) * 2.5);
    targetH = 0.8 + Math.max(0, rolling) * 0.6;
    stage = 2;
  }

  let col = colorLowGrass;
  if (targetH <= 0.25) col = colorWater;
  else if (targetH <= 0.6) col = colorSand;
  else if (targetH <= 1.8) col = colorLowGrass;
  else if (targetH <= 3.2) col = colorMidForest;
  else if (targetH <= 5.2) col = colorHighRock;
  else if (targetH <= 7.2) col = colorPeakCrag;
  else col = colorSnow;

  const delay = stage * 1.5 + (Math.abs(nx) + Math.abs(nz)) * 0.05;

  return { targetH, col, delay };
}

let idx = 0;
for (let ix = 0; ix < GRID_SIZE; ix++) {
  for (let iz = 0; iz < GRID_SIZE; iz++) {
    const info = calcBattlefield(ix, iz);
    const px = (ix - (GRID_SIZE - 1) / 2) * TILE_W;
    const pz = (iz - (GRID_SIZE - 1) / 2) * TILE_W;
    
    tileData.push({
      index: idx,
      px, pz,
      targetH: info.targetH,
      color: info.col,
      delay: info.delay,
      baseH: 0.3
    });

    terrainMesh.setColorAt(idx, colorLowGrass);
    dummy.position.set(px, 0.15, pz);
    dummy.scale.set(1, 0.3, 1);
    dummy.updateMatrix();
    terrainMesh.setMatrixAt(idx, dummy.matrix);
    idx++;
  }
}
terrainMesh.instanceMatrix.needsUpdate = true;
if (terrainMesh.instanceColor) terrainMesh.instanceColor.needsUpdate = true;

const horizonGroup = new THREE.Group();
scene.add(horizonGroup);

const horizonMat = new THREE.MeshLambertMaterial({ color: 0x829ca1, flatShading: true });
const horizonFarMat = new THREE.MeshLambertMaterial({ color: 0xa1b8be, flatShading: true });

const mountainRanges = [
  { count: 18, radius: 85, hMin: 25, hMax: 55, w: 9, mat: horizonFarMat },
  { count: 26, radius: 62, hMin: 14, hMax: 32, w: 6, mat: horizonMat },
  { count: 12, radius: 46, hMin: 8, hMax: 18, w: 3.5, mat: horizonMat }
];

mountainRanges.forEach(layer => {
  for (let m = 0; m < layer.count; m++) {
    const angle = (m / layer.count) * Math.PI * 2 + (Math.sin(m * 3.7) * 0.2);
    const r = layer.radius + Math.sin(m * 2.1) * 8;
    const h = layer.hMin + Math.abs(Math.sin(m * 1.8 + 2.0)) * (layer.hMax - layer.hMin);
    const geo = new THREE.BoxGeometry(layer.w, h, layer.w * 1.3);
    const mesh = new THREE.Mesh(geo, layer.mat);
    mesh.position.set(Math.cos(angle) * r, h / 2 - 2, Math.sin(angle) * r);
    mesh.rotation.y = angle + 0.4;
    horizonGroup.add(mesh);
  }
});

const tacticalGroup = new THREE.Group();
scene.add(tacticalGroup);

const squadA_Mat = new THREE.MeshLambertMaterial({ color: 0x244b7a, flatShading: true });
const squadB_Mat = new THREE.MeshLambertMaterial({ color: 0x9b2a26, flatShading: true });
const supportMat = new THREE.MeshLambertMaterial({ color: 0xd9822b, flatShading: true });
const uGeo = new THREE.BoxGeometry(0.38, 0.4, 0.6);

const dynamicUnits = [];

for (let b = 0; b < 24; b++) {
  const u = new THREE.Mesh(uGeo, squadA_Mat);
  u.visible = false;
  tacticalGroup.add(u);
  const row = Math.floor(b / 6);
  const col = b % 6;
  dynamicUnits.push({
    mesh: u,
    target: new THREE.Vector3(-10 + col * 0.9, 3.4, -4 + row * 1.2),
    spawnTime: 7.2 + b * 0.08
  });
}

for (let r = 0; r < 30; r++) {
  const u = new THREE.Mesh(uGeo, squadB_Mat);
  u.visible = false;
  tacticalGroup.add(u);
  const col = r % 5;
  const row = Math.floor(r / 5);
  dynamicUnits.push({
    mesh: u,
    target: new THREE.Vector3(2.5 + col * 0.85, 0.5, -16 + row * 1.3),
    spawnTime: 7.5 + r * 0.07
  });
}

const bunkerGeo = new THREE.BoxGeometry(1.2, 0.8, 1.2);
for (let k = 0; k < 6; k++) {
  const bk = new THREE.Mesh(bunkerGeo, supportMat);
  bk.visible = false;
  tacticalGroup.add(bk);
  dynamicUnits.push({
    mesh: bk,
    target: new THREE.Vector3(12 + (k % 2) * 2.2, 5.8 + (k > 2 ? 1.4 : 0), -2 + k * 1.8),
    spawnTime: 6.8 + k * 0.2
  });
}

const DURATION = 11.5;
const clock = new THREE.Clock();
const tempCol = new THREE.Color();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime() % DURATION;

  let camRadius = 58;
  let camElev = 44;
  let camAngle = 0.8 + (t / DURATION) * 0.35;

  if (t < 7.0) {
    const p = t / 7.0;
    camElev = 30 + p * 14;
    camRadius = 52 + p * 6;
  } else {
    camElev = 44;
    camRadius = 58;
    camAngle = 1.15;
  }

  camera.position.x = Math.cos(camAngle) * camRadius;
  camera.position.y = camElev;
  camera.position.z = Math.sin(camAngle) * camRadius;
  camera.lookAt(0, 1.2, 0);

  for (let i = 0; i < totalTiles; i++) {
    const d = tileData[i];
    if (t < 0.5) {
      dummy.position.set(d.px, d.baseH / 2, d.pz);
      dummy.scale.set(1, d.baseH, 1);
      dummy.updateMatrix();
      terrainMesh.setMatrixAt(i, dummy.matrix);
      terrainMesh.setColorAt(i, colorLowGrass);
    } else {
      const elap = t - d.delay;
      if (elap > 0) {
        const prog = Math.min(1.0, elap / 0.6);
        const ease = 1 - Math.pow(1 - prog, 3);
        const curH = d.baseH + (d.targetH - d.baseH) * ease;
        dummy.position.set(d.px, curH / 2, d.pz);
        dummy.scale.set(1, curH, 1);
        dummy.updateMatrix();
        terrainMesh.setMatrixAt(i, dummy.matrix);

        tempCol.lerpColors(colorLowGrass, d.color, Math.min(1.0, ease * 1.4));
        terrainMesh.setColorAt(i, tempCol);
      } else {
        dummy.position.set(d.px, d.baseH / 2, d.pz);
        dummy.scale.set(1, d.baseH, 1);
        dummy.updateMatrix();
        terrainMesh.setMatrixAt(i, dummy.matrix);
        terrainMesh.setColorAt(i, colorLowGrass);
      }
    }
  }
  terrainMesh.instanceMatrix.needsUpdate = true;
  if (terrainMesh.instanceColor) terrainMesh.instanceColor.needsUpdate = true;

  dynamicUnits.forEach(u => {
    if (t >= u.spawnTime && t < DURATION - 0.4) {
      u.mesh.visible = true;
      u.mesh.position.copy(u.target);
      const sp = Math.min(1.0, (t - u.spawnTime) / 0.25);
      u.mesh.scale.setScalar(sp);
    } else {
      u.mesh.visible = false;
    }
  });

  renderer.render(scene, camera);
}

animate();

function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_7 -->
</body>
</html>
